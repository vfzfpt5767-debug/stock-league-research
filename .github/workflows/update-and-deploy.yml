# データの自動更新と公開
# - 毎週月曜の夕方（日本時間 18:37ごろ）に、金融庁 EDINET の会社情報・決算データを取り直して docs/data に保存し、GitHub Pages に公開する
#   （決算データは、リポジトリの Secret「EDINET_API_KEY」が登録されているときだけ取得する）
# - 株価などの市場データは取得しない（規約上問題なく取得・公開できるデータ源がないため。DECISIONS.md 参照）
# - main ブランチに変更が入ったとき（CSVの編集など）も、データを作り直して公開する
# - 「Actions」タブの「Run workflow」ボタンで手動でも実行できる
name: データ更新と公開

on:
  schedule:
    - cron: "37 9 * * 1"   # UTC 9:37 = 日本時間 18:37（毎週月曜）
  push:
    branches: [main]
    paths:
      - "config/**"
      - "slr/**"
      - "docs/**"
      - "!docs/data/**"
      - ".github/workflows/update-and-deploy.yml"
  workflow_dispatch:
    inputs:
      days:
        description: "EDINETの提出書類一覧を調べる日数の上限（初回は400程度）"
        type: number
        default: 60

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Python の部品を入れる
        run: pip install -r requirements.txt

      - name: テスト（CSVの書き方チェックを含む）
        run: python -m pytest -q

      # 取得したファイルを次回も使えるように保存（相手サイトへのアクセスを減らすため）
      - name: 取得キャッシュを復元
        uses: actions/cache@v4
        with:
          path: .cache/http
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-

      - name: データを集める
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: |
          python -m slr.build --edinet-max-days ${{ inputs.days || 60 }}

      - name: 変わったデータを保存（コミット）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          # 更新時刻（meta.json）だけが変わったときはコミットしない
          if git diff --cached --quiet -- docs/data ':!docs/data/meta.json'; then
            echo "データに変更はありません"
          else
            git commit -m "データ更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') JST"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 5
            done
          fi

      - name: 公開用のファイルをまとめる
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages に公開
        id: deployment
        uses: actions/deploy-pages@v4
